[package]
name = "daly-mqtt"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
byteorder = "1.5.0"
bytes = "1.6.0"
clap = { version = "4.5.9", features = ["derive"] }
futures = "0.3.30"
tokio = { version = "1.38.0", features = ["rt", "macros"] }
tokio-serial = "5.4.4"
tokio-util = { version = "0.7.11", features = ["codec"] }
